</style><rect class="bg" width="1200" height="600"/><text class="h" x="40" y="45" style="font-size:27px">VitalSync – High-level System Architecture</text>
<rect class="box" x="60" y="130" width="230" height="100" rx="10"/><text class="h" x="76" y="168">Doctor / Patient</text><text class="t" x="76" y="198">Web browser</text><rect class="box" x="370" y="130" width="230" height="100" rx="10"/><text class="h" x="386" y="168">React + Vite</text><text class="t" x="386" y="198">UI and forms</text><rect class="box" x="700" y="130" width="230" height="100" rx="10"/><text class="h" x="716" y="168">Express API</text><text class="t" x="716" y="198">REST endpoints</text><rect class="box" x="980" y="130" width="180" height="100" rx="10"/><text class="h" x="996" y="168">MongoDB</text><text class="t" x="996" y="198">6 collections</text><rect class="box" x="700" y="330" width="230" height="100" rx="10"/><text class="h" x="716" y="368">Middleware</text><text class="t" x="716" y="398">JWT + role checks</text><rect class="box" x="370" y="330" width="230" height="100" rx="10"/><text class="h" x="386" y="368">Services</text><text class="t" x="386" y="398">Validation + rules</text><rect class="box" x="60" y="330" width="230" height="100" rx="10"/><text class="h" x="76" y="368">Socket.IO (P1)</text><text class="t" x="76" y="398">Availability events</text>
<path class="line" d="M290 180 H370"/><path class="line" d="M600 180 H700"/><path class="line" d="M930 180 H980"/>
<path class="line" d="M815 230 V330"/><path class="line" d="M700 380 H600"/><path class="line" d="M370 380 H290"/>
<text class="t" x="310" y="165">HTTPS</text><text class="t" x="620" y="165">API calls</text><text class="t" x="940" y="165">Queries</text>
<text class="t" x="60" y="500">All protected requests are authenticated and authorised on the server.</text>
<text class="t" x="60" y="530">Socket.IO is planned for a later phase; core booking works through REST APIs.</text>
